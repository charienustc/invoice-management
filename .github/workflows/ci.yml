name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify:release -- --source-only
      - run: npm audit --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - name: Install Chinese font for PDF and OCR tests
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:WINDIR 'Fonts'
          New-Item -ItemType Directory -Path $fontDirectory -Force | Out-Null
          $fontPath = Join-Path $fontDirectory 'NotoSansCJKsc-Regular.otf'
          curl.exe --fail --location --retry 3 --output $fontPath 'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf'
          if ($LASTEXITCODE -ne 0) { throw 'Chinese font download failed' }
          if ((Get-FileHash -LiteralPath $fontPath -Algorithm SHA256).Hash -ne '2C76254F6FC379FDDFCE0A7E84FB5385BB135D3E399294F6EEB6680D0365B74B') { throw 'Chinese font checksum mismatch' }
          $fontRegistry = 'HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
          New-Item -Path $fontRegistry -Force | Out-Null
          New-ItemProperty -Path $fontRegistry -Name 'Noto Sans CJK SC (OpenType)' -Value $fontPath -PropertyType String -Force | Out-Null
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class FontRegistration {
            [DllImport("gdi32.dll", CharSet = CharSet.Unicode)] public static extern int AddFontResourceW(string path);
            [DllImport("user32.dll")] public static extern bool SendNotifyMessageW(IntPtr window, uint message, IntPtr wparam, IntPtr lparam);
          }
          '@
          if ([FontRegistration]::AddFontResourceW($fontPath) -eq 0) { throw 'Chinese font registration failed' }
          [FontRegistration]::SendNotifyMessageW([IntPtr]0xffff, 0x001d, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          node --input-type=module -e "import { GlobalFonts } from '@napi-rs/canvas'; if (!GlobalFonts.has('Noto Sans CJK SC')) throw new Error('Chinese font unavailable to canvas'); console.log('Chinese font ready')"
      - run: npm test
      - run: npm run test:e2e
      - name: Prepare OCR build environment
        shell: pwsh
        run: |
          python -m venv .tmp/ocr-venv
          .tmp/ocr-venv/Scripts/python.exe -m pip install -r scripts/ocr/requirements.txt
          "INVOICE_OCR_PYTHON=$((Resolve-Path .tmp/ocr-venv/Scripts/python.exe).Path)" >> $env:GITHUB_ENV
      - run: npm run dist:win
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-test-diagnostics
          path: |
            .tmp/pdf-regression/*.png
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/*/*.exe
