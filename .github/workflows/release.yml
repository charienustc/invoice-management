name: Publish verified Windows installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows checks run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source run and release target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e '.conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/ci.yml"' run.json
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json
          test "$(jq -r .head_sha run.json)" = "$(jq -r .targetCommitish release.json)"
          jq -e '.isDraft == true' release.json
      - name: Upload verified installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name windows-installer --dir installer
          mapfile -t files < <(find installer -type f -name '*.exe')
          test "${#files[@]}" = 1
          expected="Invoice-Management-${RELEASE_TAG#v}-Windows-x64.exe"
          test "$(basename "${files[0]}")" = "$expected"
          cp "${files[0]}" "$expected"
          sha256sum "$expected" > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$expected" SHA256SUMS.txt --clobber
